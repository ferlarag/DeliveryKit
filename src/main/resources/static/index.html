<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeliveryKit</title>
    <style>
        body {
            font: 16px system-ui, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            color: #172334;
            background: #f7f9fc;
        }

        h1 {
            font-size: 1.8rem
        }

        section {
            background: white;
            border: 1px solid #d9e0ea;
            border-radius: 10px;
            padding: 20px;
            margin: 18px 0
        }

        label {
            display: block;
            margin: 12px 0 5px
        }

        input, textarea, button {
            box-sizing: border-box;
            font: inherit
        }

        input, textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #aab7c6;
            border-radius: 5px
        }

        textarea {
            min-height: 100px
        }

        button {
            padding: 9px 14px;
            margin-top: 12px;
            background: #175cd3;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #eef3f8;
            padding: 12px;
            border-radius: 5px
        }

        small {
            color: #536477
        }
    </style>
</head>
<body>
<h1>DeliveryKit</h1>
<p>Register a recipient, submit an event, and inspect or retry a delivery.</p>
<section><label for="token">Admin token</label><input id="token" type="password" autocomplete="off"><small>Used only for
    endpoint management and manual retry. Stored in this page's memory until refresh.</small></section>
<section><h2>Recipients</h2>
    <form id="endpoint-form"><label for="url">HTTPS endpoint URL</label><input id="url" type="url" required
                                                                               placeholder="https://example.com/webhook">
        <button>Add endpoint</button>
    </form>
    <button id="load-endpoints">Refresh list</button>
    <pre id="endpoints">[]</pre>
</section>
<section><h2>Send event</h2>
    <form id="event-form"><label for="event-id">Unique event ID</label><input id="event-id" required><label
            for="payload">JSON payload</label><textarea id="payload">{"kind":"demo"}</textarea>
        <button>Queue event</button>
    </form>
    <pre id="event-result"></pre>
</section>
<section><h2>Delivery</h2>
    <form id="delivery-form"><label for="delivery-id">Delivery ID</label><input id="delivery-id" required>
        <button>Check status</button>
    </form>
    <button id="retry">Retry failed delivery</button>
    <pre id="delivery-result"></pre>
</section>
<script>
    const $ = id => document.getElementById(id);
    $('event-id').value = crypto.randomUUID();

    async function request(path, options = {}) {
        const response = await fetch(path, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || data.message || `HTTP ${response.status}`);
        return data;
    }

    const admin = () => ({'X-Admin-Token': $('token').value, 'Content-Type': 'application/json'});

    async function show(result, action) {
        try {
            $(result).textContent = JSON.stringify(await action(), null, 2);
        } catch (e) {
            $(result).textContent = e.message;
        }
    }

    $('endpoint-form').onsubmit = e => {
        e.preventDefault();
        show('endpoints', async () => {
            await request('/endpoints', {
                method: 'POST',
                headers: admin(),
                body: JSON.stringify({url: $('url').value})
            });
            return request('/endpoints', {headers: admin()});
        });
    };
    $('load-endpoints').onclick = () => show('endpoints', () => request('/endpoints', {headers: admin()}));
    $('event-form').onsubmit = e => {
        e.preventDefault();
        show('event-result', async () => {
            const data = await request('/webhooks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({eventId: $('event-id').value, payload: JSON.parse($('payload').value)})
            });
            if (data.deliveryIds.length) $('delivery-id').value = data.deliveryIds[0];
            return data;
        });
    };
    $('delivery-form').onsubmit = e => {
        e.preventDefault();
        show('delivery-result', () => request('/deliveries/' + encodeURIComponent($('delivery-id').value)));
    };
    $('retry').onclick = () => show('delivery-result', () => request('/deliveries/' + encodeURIComponent($('delivery-id').value) + '/retry', {
        method: 'POST',
        headers: admin()
    }));
</script>
</body>
</html>
