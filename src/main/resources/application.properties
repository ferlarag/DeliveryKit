spring.application.name=deliverykit
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/webhooks}
spring.datasource.username=${DATABASE_USER:webhooks}
spring.datasource.password=${DATABASE_PASSWORD:webhooks}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
app.admin-token=${ADMIN_TOKEN}
app.allow-http-targets=${ALLOW_HTTP_TARGETS:false}
app.worker-enabled=${WORKER_ENABLED:true}
app.worker-poll-interval-ms=${WORKER_POLL_INTERVAL_MS:1000}
app.worker-concurrency=${WORKER_CONCURRENCY:4}
